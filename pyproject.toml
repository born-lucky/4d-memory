[project]
name = "fourdmem"
version = "0.1.0"
description = "4D memory harness for AI agents: a mnemonic palace on a Z^4 lattice that fights context rot."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Cole" }]
keywords = ["memory", "context-rot", "agents", "hilbert", "quantization", "lean"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "math-verify[antlr4_13_2]>=0.9.0",
  "sympy>=1.14",
  "numpy>=2.0",
  "tiktoken>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mini-swe-agent>=2.4"]
harness = ["mini-swe-agent>=2.4"]
pack = ["zstandard>=0.23"]

[project.scripts]
fourdmem = "fourdmem.cli:main"

[project.urls]
Homepage = "https://github.com/born-lucky/4d-memory"
Documentation = "https://github.com/born-lucky/4d-memory/blob/main/docs/MATH.md"
Design = "https://github.com/born-lucky/4d-memory/blob/main/docs/DESIGN.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fourdmem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
